<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Basic page info. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashbord</title>
    <!-- Import map for zod in browser modules. -->
    <script type="importmap">{"imports": {"zod": "https://cdn.jsdelivr.net/npm/zod@3.22.4/+esm"}}</script>
    <!-- Main UI module generated by TypeScript build. -->
    <script type="module" src="./dist/ui/stockDomView.js"></script>
    <!-- Tailwind setup and dark-mode config. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 p-6 transition-colors">

    <!-- Dashboard header with theme toggle. -->
    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold uppercase tracking-widest">Dashboard</h1>
            <button id="themeToggle" class="text-sm border border-gray-300 dark:border-gray-600 px-3 py-1 rounded">
                Mode <span class="dark:hidden">Sombre</span><span class="hidden dark:inline">Clair</span>
            </button>
        </div>

        <!-- Stock and period selectors with load button. -->
        <div class="flex gap-4 mb-6">
            <select id="stockSelect" class="bg-transparent border-b-2 border-gray-300 dark:border-gray-600 py-1 focus:border-blue-500 outline-none flex-1 dark:bg-gray-900 dark:text-white">
                <option>Chargement</option>
            </select>

            <select id="periodSelect" class="bg-transparent border-b-2 border-gray-300 dark:border-gray-600 py-1 focus:border-blue-500 outline-none w-32 dark:bg-gray-900 dark:text-white">
                <option value="7">1 semaine</option>
                <option value="30" selected>1 mois</option>
                <option value="365">1 an</option>
            </select>

            <button id="loadBtn" class="bg-blue-600 text-white px-4 py-1 rounded hover:bg-blue-700 transition">
                Charger
            </button>
        </div>

        <!-- Area updated dynamically by stockDomView.ts. -->
        <div id="displayArea" class="border-t dark:border-gray-800 pt-6">
            <p class="text-gray-400 italic text-sm text-center">Aucune donnée sélectionnée.</p>
        </div>
    </div>
</body>
</html>

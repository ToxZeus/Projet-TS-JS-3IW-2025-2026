<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashbord</title>
    <script type="importmap">{"imports": {"zod": "https://cdn.jsdelivr.net/npm/zod@3.22.4/+esm", "chart.js/auto": "./node_modules/chart.js/auto/auto.js", "@kurkle/color": "./node_modules/@kurkle/color/dist/color.esm.js"}}</script>
    <script type="module" src="./dist/ui/stockDomView.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 p-4 sm:p-6 transition-colors">
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div class="max-w-5xl mx-auto">
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl shadow-sm p-4 sm:p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-semibold uppercase tracking-[0.18em]">Dashboard</h1>
            <button id="themeToggle" class="text-sm border border-gray-300 dark:border-gray-600 px-3 py-1.5 rounded-md hover:bg-gray-50 dark:hover:bg-gray-800 transition">
                Mode <span class="dark:hidden">Sombre</span><span class="hidden dark:inline">Clair</span>
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mb-6 items-start">
            <div class="md:col-span-6">
                <label class="block text-xs uppercase tracking-wide text-gray-500 mb-1">Actions (multi-sélection)</label>
                <div id="stockChecklist" class="max-h-44 overflow-y-auto rounded-lg border border-gray-300 dark:border-gray-700 p-2 bg-white dark:bg-gray-900">
                    <p class="text-sm text-gray-500">Chargement...</p>
                </div>
                <div class="mt-2 flex items-center gap-2">
                    <button id="selectAllStocksBtn" type="button" class="text-xs px-2.5 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-800 transition">Tout sélectionner</button>
                    <button id="clearStocksBtn" type="button" class="text-xs px-2.5 py-1.5 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-800 transition">Réinitialiser</button>
                </div>
                <p id="stockSelectHint" class="text-xs text-gray-500 mt-2">Clique sur les cases pour cocher/décocher les actions.</p>
                <p id="stockSelectionSummary" class="text-xs text-gray-500 mt-1">Aucune action sélectionnée.</p>
            </div>

            <div class="md:col-span-2">
                <label for="periodSelect" class="block text-xs uppercase tracking-wide text-gray-500 mb-1">Période</label>
                <select id="periodSelect" class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 py-2 px-2 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none dark:text-white">
                    <option value="7">1 semaine</option>
                    <option value="30" selected>1 mois</option>
                    <option value="365">1 an</option>
                </select>
            </div>

            <div class="md:col-span-2">
                <label for="chartTypeSelect" class="block text-xs uppercase tracking-wide text-gray-500 mb-1">Graphique</label>
                <select id="chartTypeSelect" class="w-full bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 py-2 px-2 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none dark:text-white">
                    <option value="line" selected>Lignes</option>
                    <option value="bar">Barres</option>
                </select>
            </div>

            <button id="loadBtn" class="md:col-span-2 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition font-medium">
                Charger
            </button>
            <button id="exportCsvBtn" type="button" class="md:col-span-2 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-700 px-4 py-2 rounded-md hover:bg-gray-50 dark:hover:bg-gray-800 transition font-medium">
                Exporter CSV
            </button>
        </div>

        <div id="displayArea" class="border-t border-gray-200 dark:border-gray-800 pt-6">
            <p class="text-gray-400 italic text-sm text-center">Aucune donnée sélectionnée.</p>
        </div>
        </div>
    </div>
</body>
</html>
